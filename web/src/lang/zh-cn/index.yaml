# 技术栈
techTitle: 技术栈
techSubtitle: 流行、稳定、高效的技术选型
techGolang: 高性能后端语言，Gin 框架 + GORM + 泛型驱动的服务端架构
techTypeScript: 类型安全的 JavaScript 超集，前端顶流，Vue3 使用它编写，它使用 Go 编写
techPostgreSQL: 强大的开源关系型数据库，读写分离支持 + 使用 golang migrate 自动迁移数据表
techVue: 渐进式前端框架搭配顶流构建工具，setup 语法糖 + pinia 轻量级状态管理
techElementPlus: Vue3 生态流行组件库，统一的 UI 风格，国际化开箱即用
techAgent: 灵活使用 Codex / CC 等 AI 驱动的编码智能体，AI 负责代码生成、重构与初步审查，开发者负责调度与验收，人机协同效率拉满

