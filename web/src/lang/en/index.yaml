# Tech stack
techTitle: Tech Stack
techSubtitle: Popular, stable, and efficient technology choices
techGolang: High-performance backend language, Gin framework + GORM + generic-driven server architecture
techTypeScript: Type-safe JavaScript superset — the top frontend choice, powering Vue 3 and itself built in Go
techPostgreSQL: Powerful open-source relational database with read-write separation and golang-migrate for automatic table migration
techVue: Progressive frontend framework with top-tier build tooling, setup sugar, and Pinia for lightweight state management
techElementPlus: A popular component library in the Vue 3 ecosystem with unified UI style and i18n out of the box
techAgent: Flexibly use AI-driven coding agents like Codex / CC — they handle code generation, refactoring, and initial review, while developers orchestrate and accept, maximizing human-AI collaboration

