# Air 配置文件 - 开发环境热重载
# 文档: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # 监听这些扩展名的文件变化
  include_ext = ["go", "yaml", "yml", "env"]

  # 监听这些目录
  include_dir = ["cmd", "internal", "config"]

  # 额外监听指定的文件
  include_file = [".env.yaml"]

  # 忽略这些目录
  exclude_dir = ["tmp", "vendor", ".git", "node_modules", "web"]

  # 忽略这些文件
  exclude_file = []

  # 排除正则匹配的文件（如测试文件）
  exclude_regex = ["_test\\.go$"]

  # 排除不变的目录
  exclude_unchanged = true

  # 符号跟随
  follow_symlink = true

  # 日志文件名
  log = "air.log"

  # 执行的命令
  cmd = "go build -o ./tmp/aigo.exe ./cmd/main.go"

  # 运行的二进制文件
  entrypoint = ["./tmp/aigo.exe"]

  # 运行时的参数
  args_bin = []

  # 延迟触发构建（毫秒），避免频繁重建
  delay = 1000

  # 发生错误时停止运行
  stop_on_error = true

[log]
  # 显示日志时间
  time = true

  # 只显示主日志
  main_only = false

[color]
  # 自定义日志颜色
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # 退出时清理临时目录
  clean_on_exit = true

[screen]
  # 保持滚动
  clear_on_rebuild = true
