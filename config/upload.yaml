upload:
  # 本地磁盘存储根目录（可指定独立盘或挂载点，如 /data，且已有静态服务能正常响应）
  dir: static/upload
  # 上传文件访问 URL 前缀，只支持以 /static 开头（无论文件存储于何处），使用其他前缀需自建静态服务 + 配置 cdn.url
  url_prefix: /static/upload
  # 最大上传大小（字节），默认 10MB，填 0 则不限制
  max_size: 10485760
  # 存储文件名格式化方法，支持变量:topic=业务的主题或分类,fileName=原始文件名（最多前 15 位）
  filename: "{topic}/{year}{mon}{day}/{fileName}{fileSha1}{.suffix}"
  # 上传文件后缀白名单，请永远使用最少配置，此处有意设计为不支持通配符
  allow_suffix:
    - jpg
    - png
    - bmp
    - jpeg
    - gif
    - webp
    - svg
    - avif
    - zip
    - rar
    - wav
    - mp4
    - mp3
